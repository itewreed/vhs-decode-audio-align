

stages:
  - build_test_pack_app
  - build_appimage

app:
  image: mono:6
  stage: build_test_pack_app
  timeout: 15m
  script:
    - /bin/bash ci-install-packages.sh
    - /bin/bash ci-build.sh
    - /bin/bash ci-test.sh
    - /bin/bash ci-package.sh
  artifacts:
    paths: 
     - ./*.zip
    reports:
      junit:
      - ./**/*-results.junit.xml

appimage_amd64:
  tags: [ saas-linux-small-amd64 ]
  image: ubuntu:24.04
  stage: build_appimage
  timeout: 2h
  dependencies:
    - app
  script:
    - /bin/bash ci-build-appimage.sh
  artifacts:
    paths: 
     - ./mono-build.log
     - ./*.AppImage

appimage_arm64:
  tags: [ saas-linux-small-arm64 ]
  image: ubuntu:24.04
  stage: build_appimage
  timeout: 3h
  dependencies:
    - app
  script:
    - /bin/bash ci-build-appimage.sh
  artifacts:
    paths: 
     - ./mono-build.log
     - ./*.AppImage
